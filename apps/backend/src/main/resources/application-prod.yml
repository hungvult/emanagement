server:
  port: ${PORT:8080}
  forward-headers-strategy: native

spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000


  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect


  # Cấu hình SMTP gửi Email thật qua Gmail
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:vandunglc2005pro@gmail.com}
    password: ${MAIL_PASSWORD:nact oolc fsww xnto}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket-name: ${MINIO_BUCKET:attendance-images-prod}

ai-service:
  base-url: ${AI_SERVICE_URL:http://localhost:8000}
  validate-frame-endpoint: /api/v1/cv/validate-frame
  enroll-endpoint: /api/v1/cv/enroll
  recognize-endpoint: /api/v1/cv/recognize
  confidence-threshold: 85.0
  mock-enabled: ${AI_SERVICE_MOCK:false}

