server:
  port: ${PORT:8080}
  forward-headers-strategy: native

spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate # Nghiêm cấm auto-ddl trên Prod, dùng script init.sql
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

minio:
  endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket-name: ${MINIO_BUCKET:attendance-images-prod}

ai-service:
  base-url: ${AI_SERVICE_URL}
  extract-embeddings-endpoint: /api/v1/cv/extract-embeddings
  match-face-endpoint: /api/v1/cv/match
  confidence-threshold: 85.0

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000