spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod} # Mặc định là môi trường dev

  application:
    name: backend

  flyway:
    enabled: false # Vô hiệu hóa auto-config mặc định để FlywayConfig tự quản lý chạy duy nhất 1 lần

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# Swagger / OpenAPI Metadata
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# Spring Boot Actuator & Prometheus Metrics Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    prometheus:
      enabled: true
  metrics:
    tags:
      application: emanagement-backend
