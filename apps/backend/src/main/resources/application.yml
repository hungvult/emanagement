spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod} # Mặc định là môi trường dev

  application:
    name: backend

  flyway:
    enabled: false # Vô hiệu hóa auto-config mặc định để FlywayConfig tự quản lý chạy duy nhất 1 lần

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# Swagger / OpenAPI Metadata
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# Spring Boot Actuator & Prometheus Metrics Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    prometheus:
      enabled: true
  metrics:
    tags:
      application: emanagement-backend
    distribution:
      percentiles-histogram:
        http.server.requests: true
      sla:
        http.server.requests: 10ms, 25ms, 50ms, 100ms, 150ms, 200ms, 300ms, 500ms, 750ms, 1s, 2s, 5s
      minimum-expected-value:
        http.server.requests: 1ms
      maximum-expected-value:
        http.server.requests: 10s

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration-ms: ${JWT_EXPIRATION_MS:1800000}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

