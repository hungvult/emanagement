server:
  port: ${PORT:8080}

spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:emanagement_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      data-source-properties:
        options: "-c TimeZone=Asia/Ho_Chi_Minh"

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Cấu hình SMTP gửi Email thật qua Gmail
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  # H2 Console (tùy chọn khi test nhanh local)
  h2:
    console:
      enabled: true
      path: /h2-console

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket-name: ${MINIO_BUCKET:attendance-images}
  public-url: ${MINIO_PUBLIC_URL:http://localhost:9000}

ai-service:
  base-url: ${AI_SERVICE_URL:http://localhost:8000}
  validate-frame-endpoint: /api/v1/cv/validate-frame
  enroll-endpoint: /api/v1/cv/enroll
  recognize-endpoint: /api/v1/cv/recognize
  confidence-threshold: 85.0
  mock-enabled: ${AI_SERVICE_MOCK:false}

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration-ms: ${JWT_EXPIRATION_MS:1800000} # 30 phút
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 ngày

