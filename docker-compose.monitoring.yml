# ==============================================================================
# HƯỚNG DẪN KHỞI CHẠY HỆ THỐNG GIÁM SÁT (PROMETHEUS MONITORING)
# ==============================================================================
# Điều kiện tiên quyết:
# - Môi trường Backend (dev hoặc prod) phải đang chạy để khởi tạo network chung:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# 1. Khởi chạy Prometheus (chạy nền):
#    docker compose -f docker-compose.monitoring.yml up -d
#
# 2. Theo dõi log tiến trình scrape:
#    docker compose -f docker-compose.monitoring.yml logs -f
#
# 3. Dừng hệ thống giám sát:
#    docker compose -f docker-compose.monitoring.yml down
#
# 4. Kiểm tra trạng thái hoạt động:
#    - Prometheus Web UI: http://localhost:9090
#    - Scrape Targets   : http://localhost:9090/targets (Target "spring-boot-backend" trạng thái UP)
#    - Backend Metrics  : http://localhost:8080/actuator/prometheus
#
# ==============================================================================

name: emanagement-monitoring

services:
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: emanagement-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--storage.tsdb.retention.time=15d"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - emanagement-net

networks:
  emanagement-net:
    name: emanagement_emanagement-net
    external: true

volumes:
  prometheus_data:
