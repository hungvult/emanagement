# Map connection upgrade for WebSocket support while preserving HTTP/1.1 keep-alive
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Preserve upstream X-Forwarded-Proto if present (e.g., Cloudflare Tunnel), otherwise fallback to local scheme
map $http_x_forwarded_proto $proxy_x_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# Rate limiting zone for API requests: 15 requests/second per IP, 10MB memory zone
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=15r/s;

server {
    listen 80;
    server_name localhost;

    # Re-resolve Docker service names after containers are recreated and get new IPs.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    set $frontend_upstream frontend:3000;
    set $backend_upstream backend:8080;
    set $cv_upstream cv-service:8000;
    set $minio_upstream minio:9000;

    # Maximum file upload size (matches backend multipart config: 10MB + buffer)
    client_max_body_size 20M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Health check & Internal endpoints protection
    location = /actuator/health {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
    }

    location ^~ /swagger-ui {
        return 404;
    }

    location ^~ /v3/api-docs {
        return 404;
    }

    location ^~ /actuator {
        return 404;
    }

    # MinIO Storage proxy (attendance & eKYC images)
    location /storage/ {
        limit_except GET HEAD {
            deny all;
        }

        rewrite ^/storage/(.*)$ /$1 break;
        proxy_pass http://$minio_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_connect_timeout 300s;
        proxy_read_timeout 300s;
        chunked_transfer_encoding off;
    }

    # CV Service (Face validation and enrollment)
    location ^~ /api/v1/cv/ {
        client_max_body_size 20M;

        proxy_pass http://$cv_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
    }

    # Internal API (exempt from public rate limiting for bulk operations)
    location ^~ /api/v1/internal/ {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        client_max_body_size 20M;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
    }

    # Backend REST API
    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;
        limit_req_status 429;

        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
        proxy_buffering on;
    }

    # Monitoring Subpath Trailing Slash Redirects
    location = /grafana {
        return 301 /grafana/;
    }

    location = /prometheus {
        return 301 /prometheus/;
    }

    # Monitoring - Grafana Dashboard UI
    location /grafana/ {
        set $upstream_grafana http://grafana:3000;
        proxy_pass $upstream_grafana;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
    }

    # Monitoring - Prometheus UI & Metrics Server
    location /prometheus/ {
        set $upstream_prometheus http://prometheus:9090;
        proxy_pass $upstream_prometheus;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
    }

    # Nginx Native Metrics for Prometheus scraper
    location = /nginx_status {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        allow 192.168.0.0/16;
        deny all;
    }

    # Next.js Static Files (immutable assets with content hashes)
    location /_next/static/ {
        proxy_pass http://$frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Frontend Next.js Application
    location / {
        proxy_pass http://$frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
    }
}
