services:
  postgres:
    image: postgres:16-alpine
    container_name: emanagement-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-emanagement_db}
      POSTGRES_USER: ${DB_USER:?DB_USER must be set in environment}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in environment}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - emanagement-net

  minio:
    image: elestio/minio:latest
    container_name: emanagement-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set in environment}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set in environment}
    expose:
      - "9000"
      - "9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - emanagement-net

  minio-init:
    image: elestio/minio:latest
    container_name: emanagement-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/$${MINIO_BUCKET:-attendance-images-prod};
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set in environment}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set in environment}
      MINIO_BUCKET: ${MINIO_BUCKET:-attendance-images-prod}
    networks:
      - emanagement-net

  cv-service:
    build:
      context: ./apps/cv-service
      dockerfile: Dockerfile
    container_name: emanagement-cv-service
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8000
      - SPRING_BOOT_URL=http://backend:8080
    expose:
      - "8000"
    volumes:
      - ./apps/cv-service/weights:/app/weights:ro
      - ./apps/cv-service/app:/app/app:ro

    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - |
          import urllib.request, urllib.error
          try:
              urllib.request.urlopen('http://localhost:8000/api/v1/cv/health', timeout=3)
              exit(0)
          except urllib.error.HTTPError as e:
              exit(0 if e.code == 503 else 1)
          except Exception:
              exit(1)
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - emanagement-net

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: emanagement-backend
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      JAVA_OPTS: "-Duser.timezone=${TZ:-Asia/Ho_Chi_Minh} -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-emanagement_db}
      DB_USER: ${DB_USER:?DB_USER must be set in environment}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in environment}
      AI_SERVICE_URL: http://cv-service:8000
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set in environment}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set in environment}
      MINIO_BUCKET: ${MINIO_BUCKET:-attendance-images-prod}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-/storage}
      PORT: ${PORT:-8080}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in environment}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-1800000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      cv-service:
        condition: service_started
      minio:
        condition: service_healthy
    networks:
      - emanagement-net

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
    container_name: emanagement-frontend
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-/api/v1}
      - INTERNAL_BACKEND_URL=${INTERNAL_BACKEND_URL:-http://backend:8080}
      - INTERNAL_MINIO_URL=${INTERNAL_MINIO_URL:-http://minio:9000}
      - INTERNAL_CV_SERVICE_URL=${INTERNAL_CV_SERVICE_URL:-http://cv-service:8000}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - emanagement-net

  nginx:
    image: nginx:alpine
    container_name: emanagement-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
      - cv-service
    networks:
      - emanagement-net

networks:
  emanagement-net:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
