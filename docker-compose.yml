services:
  postgres:
    image: postgres:16-alpine
    container_name: emanagement-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-emanagement_db}
      POSTGRES_USER: ${DB_USER:-dung}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dung123}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-dung} -d ${DB_NAME:-emanagement_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - emanagement-net

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: emanagement-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-emanagement_db}
      DB_USER: ${DB_USER:-dung}
      DB_PASSWORD: ${DB_PASSWORD:-dung123}
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - emanagement-net

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: emanagement-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8080/api
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - emanagement-net

networks:
  emanagement-net:
    driver: bridge

volumes:
  postgres_data:
